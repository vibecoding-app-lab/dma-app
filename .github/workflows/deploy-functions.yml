# Sends the server code (supabase/functions) to Supabase whenever it changes
# on main, so nobody has to deploy from a laptop.
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_YES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Deploy all functions
        run: supabase functions deploy --remote=zvaxeullvxzcboebzico --use-api --no-verify-jwt --yes
